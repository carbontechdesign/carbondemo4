  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

--error-bg:       #FEE2E2;\n  --error-text:     #B91C1C; /* deeper error text */\n\n  /* ─── Color: Semantic mappings (use these in components) ───────────── */\n  --bg:          #FFFFFF;\n  --bg-subtle:   var(--neutral-100);\n  --bg-muted:    var(--neutral-50);\n  --fg:          var(--neutral-900);\n  --fg-muted:    var(--neutral-700);\n  --fg-subtle:   var(--neutral-500);\n  --fg-on-brand: #FFFFFF;\n  --border:      var(--neutral-300);\n  --border-soft: rgba(214, 219, 228, 0.5);\n  --brand:       var(--blue-normal);\n  --brand-hover: var(--blue-dark);\n  --brand-active:var(--blue-darkest);\n  --brand-tint:  var(--blue-lightest);\n  --scrim:       rgba(30, 35, 43, 0.4);\n\n  /* ─── Type: Families ───────────────────────────────────────────────── */\n  --font-display: \"Plus Jakarta Sans\", system-ui, sans-serif; /* headings */\n  --font-body:    \"Open Sans\", system-ui, sans-serif;          /* body + UI */\n\n  /* ─── Type: Scale (px) ─────────────────────────────────────────────── */\n  --fs-display: 56px;  --lh-display: 1.2;   /* Display     — Jakarta 700 */\n  --fs-h1: 40px;       --lh-h1: 1.2;        /* H1          — Jakarta 700 */\n  --fs-h2: 32px;       --lh-h2: 1.3;        /* H2          — Jakarta 700 */\n  --fs-h3: 24px;       --lh-h3: 1.3;        /* H3          — Jakarta 600 */\n  --fs-h4: 20px;       --lh-h4: 1.4;        /* H4          — Jakarta 600 */\n  --fs-body-lg: 18px;  --lh-body: 1.6;      /* Body LG     — Open Sans 400 */\n  --fs-body: 16px;\n  --fs-body-sm: 14px;\n  --fs-caption: 12px;  --lh-tight: 1.5;\n  --fs-label: 12px;                          /* Label / overline — Open Sans 700, 0.08em tracking */\n  --fs-overline: 11px;                       /* Card eyebrow — uppercase, 0.12em tracking */\n\n  /* ─── Spacing scale ────────────────────────────────────────────────── */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 80  'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"cc7f1abe-8e53-4739-8545-ff7782a53aad\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"fd84bdc4-d7fd-45f2-9922-e02e45d2816c\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"e47e765f-0b6f-4f5e-b8fa-0dfca4d5e303\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"73102af1-88f9-4580-b405-1f1daf259d9d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ─── Color: Neutral scale (cool gray) ─────────────────────────────── */\n  --neutral-50:  #FAFAFC;   /* page tint / disabled input fill */\n  --neutral-100: #F5F7FA;   /* page bg, table header, chip rest */\n  --neutral-200: #EEF1F6;   /* hover surface */\n  --neutral-300: #D6DBE4;   /* borders, dividers, image placeholder */\n  --neutral-500: #9AA3B2;   /* secondary text, placeholder, muted icon */\n  --neutral-700: #5E6573;   /* body text */\n  --neutral-900: #1E232B;   /* foreground / headings */\n\n  /* ─── Color: Blue — primary brand ──────────────────────────────────── */\n  --blue-lightest: #E7F3FF; /* alert info bg, chip selected, tinted surface */\n  --blue-normal:   #1F8CFF; /* PRIMARY — buttons, links, focus rings */\n  --blue-dark:     #0F5CCB; /* hover / active / on-tint text */\n  --blue-darkest:  #093E8E; /* press / deep accent */\n\n  /* ─── Color: Logo accent (used sparingly — brand mark only) ────────── */\n  --magenta: #FC2791;     /* small accent in the brand mark */\n  --brand-navy: #4C4C78;  /* primary fill of the brand mark + \"tech\" wordmark */\n\n  /* ─── Color: Semantic ──────────────────────────────────────────────── */\n  --success:        #148A57;\n  --success-bg:     #D1FAE5;\n  --warning:        #F59E0B;\n  --warning-bg:     #FEF3C7;\n  --warning-text:   #B46E00; /* on warning-bg */\n  --warning-text-2: #92400E; /* deeper variant */\n  --error:          #E53E3E;\n  --error-bg:       #FEE2E2;\n  --error-text:     #B91C1C; /* deeper error text */\n\n  /* ─── Color: Semantic mappings (use these in components) ───────────── */\n  --bg:          #FFFFFF;\n  --bg-subtle:   var(--neutral-100);\n  --bg-muted:    var(--neutral-50);\n  --fg:          var(--neutral-900);\n  --fg-muted:    var(--neutral-700);\n  --fg-subtle:   var(--neutral-500);\n  --fg-on-brand: #FFFFFF;\n  --border:      var(--neutral-300);\n  --border-soft: rgba(214, 219, 228, 0.5);\n  --brand:       var(--blue-normal);\n  --brand-hover: var(--blue-dark);\n  --brand-active:var(--blue-darkest);\n  --brand-tint:  var(--blue-lightest);\n  --scrim:       rgba(30, 35, 43, 0.4);\n\n  /* ─── Type: Families ───────────────────────────────────────────────── */\n  --font-display: \"Plus Jakarta Sans\", system-ui, sans-serif; /* headings */\n  --font-body:    \"Open Sans\", system-ui, sans-serif;          /* body + UI */\n\n  /* ─── Type: Scale (px) ─────────────────────────────────────────────── */\n  --fs-display: 56px;  --lh-display: 1.2;   /* Display     — Jakarta 700 */\n  --fs-h1: 40px;       --lh-h1: 1.2;        /* H1          — Jakarta 700 */\n  --fs-h2: 32px;       --lh-h2: 1.3;        /* H2          — Jakarta 700 */\n  --fs-h3: 24px;       --lh-h3: 1.3;        /* H3          — Jakarta 600 */\n  --fs-h4: 20px;       --lh-h4: 1.4;        /* H4          — Jakarta 600 */\n  --fs-body-lg: 18px;  --lh-body: 1.6;      /* Body LG     — Open Sans 400 */\n  --fs-body: 16px;\n  --fs-body-sm: 14px;\n  --fs-caption: 12px;  --lh-tight: 1.5;\n  --fs-label: 12px;                          /* Label / overline — Open Sans 700, 0.08em tracking */\n  --fs-overline: 11px;                       /* Card eyebrow — uppercase, 0.12em tracking */\n\n  /* ─── Spacing scale ────────────────────────────────────────────────── */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 80px;\n  --space-10: 96px;\n\n  /* ─── Radius ───────────────────────────────────────────────────────── */\n  --r-sm: 6px;     /* icon tiles, small actions */\n  --r-md: 8px;     /* inputs, small buttons */\n  --r-lg: 16px;    /* cards, modals, alerts */\n  --r-xl: 24px;    /* hero / oversize cards */\n  --r-pill: 999px; /* buttons, chips, badges */\n\n  /* ─── Shadows ──────────────────────────────────────────────────────── */\n  --shadow-sm: 0px 1px 0px 0px var(--border);                  /* nav bottom hairline */\n  --shadow-md: 0px 4px 12px 0px rgba(30, 35, 43, 0.10);        /* cards, dropdowns */\n  --shadow-lg: 0px 8px 32px 0px rgba(30, 35, 43, 0.12);        /* popovers */\n  --shadow-xl: 0px 16px 48px 0px rgba(30, 35, 43, 0.16);       /* modals */\n  --shadow-form: 0px 4px 12px 0px rgba(30, 35, 43, 0.08);      /* form surface */\n\n  /* ─── Focus ring ───────────────────────────────────────────────────── */\n  --focus-ring: 0 0 0 3px rgba(31, 140, 255, 0.25);\n  --focus-border: 1.5px solid var(--brand);\n\n  /* ─── Tracking ─────────────────────────────────────────────────────── */\n  --track-overline: 0.12em;\n  --track-label: 0.08em;\n}\n\n/* ────────────────────────────────────────────────────────────────────── */\n/*  Semantic typography helpers — apply directly to elements              */\n/* ────────────────────────────────────────────────────────────────────── */\n\nhtml, body { font-family: var(--font-body); color: var(--fg); background: var(--bg); }\n\nh1, .h1, h2, .h2, h3, .h3, h4, .h4, .display { font-family: var(--font-display); color: var(--fg); margin: 0; }\n\n.display { font-size: var(--fs-display); font-weight: 700; line-height: var(--lh-display); letter-spacing: -0.02em; }\nh1, .h1  { font-size: var(--fs-h1);      font-weight: 700; line-height: var(--lh-h1);      letter-spacing: -0.015em; }\nh2, .h2  { font-size: var(--fs-h2);      font-weight: 700; line-height: var(--lh-h2);      letter-spacing: -0.01em; }\nh3, .h3  { font-size: var(--fs-h3);      font-weight: 600; line-height: var(--lh-h3); }\nh4, .h4  { font-size: var(--fs-h4);      font-weight: 600; line-height: var(--lh-h4); }\n\np, .body    { font-size: var(--fs-body);    line-height: var(--lh-body); color: var(--fg); margin: 0; }\n.body-lg    { font-size: var(--fs-body-lg); line-height: var(--lh-body); }\n.body-sm    { font-size: var(--fs-body-sm); line-height: var(--lh-body); }\n.caption    { font-size: var(--fs-caption); line-height: var(--lh-tight); color: var(--fg-subtle); }\n\n.label {\n  font-size: var(--fs-label);\n  font-weight: 700;\n  letter-spacing: var(--track-label);\n  color: var(--fg-muted);\n  text-transform: none;\n  font-family: var(--font-body);\n}\n\n.overline {\n  font-size: var(--fs-overline);\n  font-weight: 700;\n  letter-spacing: var(--track-overline);\n  color: var(--fg-subtle);\n  text-transform: uppercase;\n  font-family: var(--font-body);\n}\n\n/* Inline link inherits brand */\na { color: var(--brand); text-decoration: none; }\na:hover { color: var(--brand-hover); text-decoration: underline; }\n\n\n/* ─── Button ────────────────────────────────────────────────────────── */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center;\n  font-family: var(--font-body); font-weight: 700; line-height: 1;\n  border-radius: var(--r-pill); cursor: pointer;\n  transition: background 150ms cubic-bezier(.4,0,.2,1),\n              border-color 150ms cubic-bezier(.4,0,.2,1),\n              color 150ms cubic-bezier(.4,0,.2,1),\n              transform 100ms cubic-bezier(.4,0,.2,1);\n  border: 1.5px solid transparent;\n  white-space: nowrap;\n  gap: 8px;\n}\n.btn:active { transform: scale(.98); }\n.btn:disabled, .btn[aria-disabled=\"true\"] { opacity: .4; cursor: not-allowed; pointer-events: none; }\n\n.btn.lg { font-size: 16px; padding: 13px 40px; }\n.btn.md { font-size: 14px; padding: 11px 24px; }\n.btn.sm { font-size: 13px; padding: 8px 20px; }\n\n.btn-primary   { background: var(--brand); color: #fff; }\n.btn-primary:hover  { background: var(--brand-hover); }\n.btn-primary:active { background: var(--brand-active); }\n\n.btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }\n.btn-secondary:hover  { background: var(--neutral-100); }\n.btn-secondary:active { background: var(--neutral-200); }\n\n.btn-ghost { background: transparent; color: var(--brand); }\n.btn-ghost:hover  { background: var(--brand-tint); }\n.btn-ghost:active { background: rgba(31,140,255,.2); }\n\n.btn-outline { background: transparent; color: var(--brand); border-color: var(--brand); }\n.btn-outline:hover  { background: var(--brand-tint); }\n\n/* ─── Input ─────────────────────────────────────────────────────────── */\n.field { display: flex; flex-direction: column; gap: 6px; }\n.field-label { font-size: 13px; font-weight: 700; color: var(--fg); }\n.input {\n  border-radius: var(--r-md);\n  background: var(--neutral-50);\n  border: 1.5px solid var(--border);\n  padding: 11px 14px;\n  font-family: var(--font-body); font-size: 14px; color: var(--fg);\n  outline: none;\n  transition: border-color 150ms, box-shadow 150ms, background 150ms;\n}\n.input::placeholder { color: var(--fg-subtle); }\n.input:hover   { border-color: var(--neutral-500); }\n.input:focus   { border-color: var(--brand); box-shadow: var(--focus-ring); background: #fff; }\n.input.error   { border-color: var(--error); }\n.input.error:focus { box-shadow: 0 0 0 3px rgba(229,62,62,.2); }\n.input:disabled { opacity: .5; cursor: not-allowed; }\n.field-helper { font-size: 11px; color: var(--fg-subtle); }\n.field-helper.error { color: var(--error-text); }\n\n/* ─── Badge ─────────────────────────────────────────────────────────── */\n.badge {\n  display: inline-flex; align-items: center;\n  border-radius: var(--r-pill);\n  font-family: var(--font-body); font-weight: 700;\n  line-height: 1; padding: 4px 10px; font-size: 11px;\n  letter-spacing: 0.02em;\n}\n.badge.md { padding: 6px 12px; font-size: 12px; }\n.badge.blue    { background: var(--brand-tint);  color: var(--blue-dark); }\n.badge.neutral { background: var(--neutral-100); color: var(--fg-muted); }\n.badge.success { background: var(--success-bg);  color: var(--success); }\n.badge.warning { background: var(--warning-bg);  color: var(--warning-text); }\n.badge.error   { background: var(--error-bg);    color: var(--error-text); }\n.badge.outline.blue    { background: transparent; border:1px solid var(--brand);    color: var(--blue-dark); }\n.badge.outline.neutral { background: transparent; border:1px solid var(--border);   color: var(--fg-muted); }\n.badge.outline.success { background: transparent; border:1px solid var(--success);  color: var(--success); }\n.badge.outline.warning { background: transparent; border:1px solid var(--warning);  color: var(--warning-text); }\n.badge.outline.error   { background: transparent; border:1px solid var(--error);    color: var(--error-text); }\n\n/* ─── Chip ──────────────────────────────────────────────────────────── */\n.chip {\n  display:inline-flex; align-items:center; gap:6px;\n  border-radius: var(--r-pill);\n  padding: 7px 14px;\n  font-family: var(--font-body); font-size: 13px; font-weight: 700;\n  background: var(--neutral-50); color: var(--fg);\n  border: 1px solid var(--border);\n  cursor: pointer; transition: background 150ms, border-color 150ms;\n}\n.chip:hover { background: var(--neutral-100); }\n.chip.selected { background: var(--brand-tint); color: var(--blue-dark); border-color: var(--brand); }\n.chip-remove {\n  display:inline-flex;align-items:center;justify-content:center;\n  width:18px;height:18px;border-radius:999px;\n  background: rgba(31,140,255,.15); color: var(--blue-dark);\n  font-size: 12px; font-weight: 700;\n  cursor:pointer;\n}\n\n/* ─── Avatar ────────────────────────────────────────────────────────── */\n.avatar {\n  display:inline-flex;align-items:center;justify-content:center;\n  border-radius:999px;\n  background: var(--neutral-100); color: var(--fg-muted);\n  font-family: var(--font-body); font-weight: 700;\n  overflow:hidden;\n}\n.avatar.sm { width:32px; height:32px; font-size:12px; }\n.avatar.md { width:40px; height:40px; font-size:14px; }\n.avatar.lg { width:56px; height:56px; font-size:18px; }\n.avatar img { width:100%; height:100%; object-fit: cover; }\n\n/* ─── Checkbox ──────────────────────────────────────────────────────── */\n.check-row { display:flex; align-items:center; gap:10px; font-size:13px; font-weight:600; color:var(--fg); cursor:pointer; }\n.check-box {\n  width:18px; height:18px; border-radius:5px;\n  background:#fff; border:1.5px solid var(--border);\n  display:inline-flex;align-items:center;justify-content:center;\n  color:#fff; font-size:12px; line-height:1; font-weight:700;\n  transition: background 120ms, border-color 120ms;\n}\n.check-row.checked .check-box       { background: var(--brand); border-color: var(--brand); }\n.check-row.indeterminate .check-box { background: var(--brand); border-color: var(--brand); }\n.check-row.disabled { opacity: .45; cursor: not-allowed; color: var(--fg-subtle); }\n\n/* ─── Toggle / switch ───────────────────────────────────────────────── */\n.toggle {\n  width:40px; height:22px; border-radius:999px;\n  background: var(--neutral-300); position:relative; cursor:pointer;\n  transition: background 150ms;\n}\n.toggle::after {\n  content:\"\"; position:absolute; top:2px; left:2px;\n  width:18px; height:18px; border-radius:999px; background:#fff;\n  box-shadow: 0 1px 2px rgba(30,35,43,.2);\n  transition: left 150ms cubic-bezier(.4,0,.2,1);\n}\n.toggle.on { background: var(--brand); }\n.toggle.on::after { left: 20px; }\n.toggle.md { width: 48px; height: 28px; }\n.toggle.md::after { width: 24px; height: 24px; }\n.toggle.md.on::after { left: 22px; }\n.toggle-row { display:flex; align-items:center; gap:12px; font-size:14px; color:var(--fg); }\n.toggle-row.disabled { opacity: .4; cursor: not-allowed; }\n\n/* ─── Card ──────────────────────────────────────────────────────────── */\n.kit-card {\n  background:#fff; border-radius:var(--r-lg); box-shadow: var(--shadow-md);\n  overflow:hidden; display:flex; flex-direction:column;\n}\n.kit-card.flat { box-shadow: none; border: 1px solid var(--border); }\n.kit-card.highlight { border: 1.5px solid var(--brand); }\n.kit-card .img-slot {\n  height: 200px; background: var(--neutral-300);\n  display:flex;align-items:center;justify-content:center;\n  color: var(--fg-subtle); font-size: 13px;\n}\n.kit-card .body { padding: 20px; display:flex;flex-direction:column;gap:8px; }\n.kit-card .body h4 { font-size: 18px; font-weight: 700; }\n.kit-card .body p  { font-size: 14px; color: var(--fg-muted); }\n.kit-card .divider { height:1px; background: var(--border); }\n.kit-card .footer  { padding: 16px 20px; display:flex; justify-content:flex-end; }\n\n/* ─── Alert ─────────────────────────────────────────────────────────── */\n.alert {\n  display:flex; gap:14px; align-items:flex-start;\n  border-radius: 12px; padding: 16px;\n  border: 1px solid transparent;\n}\n.alert .alert-icon {\n  width:28px; height:32px; border-radius:999px; flex-shrink:0;\n  display:inline-flex;align-items:center;justify-content:center;\n  color:#fff; font-weight:700; font-size:14px; line-height:1;\n}\n.alert .alert-body { flex: 1; }\n.alert .alert-title { font-size:14px; font-weight:700; margin:0 0 4px; }\n.alert .alert-text  { font-size:13px; line-height:1.55; color: var(--fg-muted); margin:0; }\n.alert .alert-close {\n  font-size: 18px; color: var(--fg-subtle); cursor:pointer; line-height:1;\n  padding: 0 4px; flex-shrink:0;\n}\n/* Filled */\n.alert.info    { background: var(--brand-tint); border-color: rgba(31,140,255,.3); }\n.alert.info    .alert-icon  { background: var(--brand); }\n.alert.info    .alert-title { color: var(--blue-dark); }\n.alert.success { background: var(--success-bg); border-color: rgba(20,138,87,.3); }\n.alert.success .alert-icon  { background: var(--success); }\n.alert.success .alert-title { color: var(--success); }\n.alert.warning { background: var(--warning-bg); border-color: rgba(245,158,11,.3); }\n.alert.warning .alert-icon  { background: var(--warning); }\n.alert.warning .alert-title { color: var(--warning-text-2); }\n.alert.error   { background: var(--error-bg);   border-color: rgba(229,62,62,.3); }\n.alert.error   .alert-icon  { background: var(--error); }\n.alert.error   .alert-title { color: var(--error-text); }\n/* Outline */\n.alert.outline { background: #fff; }\n.alert.outline.info    { border-color: var(--brand); }\n.alert.outline.success { border-color: var(--success); }\n.alert.outline.warning { border-color: var(--warning); }\n.alert.outline.error   { border-color: var(--error); }\n.alert.outline .alert-icon { background: transparent; border: 1.5px solid currentColor; }\n.alert.outline.info    .alert-icon { color: var(--brand); }\n.alert.outline.success .alert-icon { color: var(--success); }\n.alert.outline.warning .alert-icon { color: var(--warning); }\n.alert.outline.error   .alert-icon { color: var(--error); }\n<\u002Fstyle>\n<style>\n  html,body{margin:0;background:#DF Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px;justify-content:center;margin-top:16px;font-size:11.5px;color:var(--fg-subtle);\">\n                  <span style=\"width:10px;height:10px;border-radius:999px;background:var(--brand);display:inline-block;\"><\u002Fspan>Hoje\n                  <span style=\"font-size:9px;font-weight:700;color:var(--blue-dark);background:var(--blue-lightest);border-radius:999px;padding:1px 6px;margin-left:8px;\">n<\u002Fspan>visitas planejadas\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- Tab bar -->\n        <sc-if value=\"{{ showTabBar }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:none;display:flex;background:#fff;border-top:1px solid var(--border);padding:9px 8px 22px;box-shadow:0 -1px 0 var(--border);\">\n          <div sc-camel-on-click=\"{{ goAgenda }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:{{ cAgenda }};\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2.5\" stroke=\"currentColor\" stroke-width=\"2\"><\u002Frect><path d=\"M3 9.5h18M8 3v4M16 3v4\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size:10.5px;font-weight:600;\">Agenda<\u002Fspan>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ goOco }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:{{ cOco }};position:relative;\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l9 16H3l9-16Z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M12 9v5M12 17h.01\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size:10.5px;font-weight:600;\">Ocorrências<\u002Fspan>\n            <span style=\"position:absolute;top:-3px;right:22px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--error);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;\">{{ ocoBadge }}<\u002Fspan>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ goRank }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:{{ cRank }};\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M6 4h12v4a6 6 0 0 1-12 0V4Z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M6 6H3v1a3 3 0 0 0 3 3M18 6h3v1a3 3 0 0 1-3 3M9 20h6M12 14v6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size:10.5px;font-weight:600;\">Jornada<\u002Fspan>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ goPerfil }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:{{ cPerfil }};\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"8\" r=\"4\" stroke=\"currentColor\" stroke-width=\"2\"><\u002Fcircle><path d=\"M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size:10.5px;font-weight:600;\">Perfil<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Toast -->\n        <sc-if value=\"{{ showToast }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;left:16px;right:16px;bottom:96px;z-index:50;background:var s => ({ selStore: id, stack: [...s.stack, 'store'] }));\n  startCheckin = () => this.push('checkin');\n  continueVisit = () => this.push('execucao');\n  confirmCheckin = () => this.setState(s => ({ checkedIn: { ...s.checkedIn, [s.selStore]: true }, storeStatus: { ...s.storeStatus, [s.selStore]: 'active' }, stack: [...s.stack.slice(0, -1), 'execucao'] }));\n  openSurvey = (id) => this.setState(s => ({ selAct: id, stack: [...s.stack, 'survey'] }));\n  toggleAct = (id) => this.setState(s => ({ actDone: { ...s.actDone, [id]: !s.actDone[id] } }));\n  submitSurvey = () => {\n    const crit = this.state.survey.ruptura === 'sim';\n    this.setState(s => ({ actDone: { ...s.actDone, [s.selAct]: true }, stack: s.stack.slice(0, -1) }));\n    this.fire(crit ? 'Resposta crítica · ocorrência criada e alerta disparado (WhatsApp + push)' : 'Respostas enviadas · na fila de sincronização');\n  };\n  finalizeVisit = () => { this.setState(s => ({ storeStatus: { ...s.storeStatus, [s.selStore]: 'done' }, stack: [], tab: 'agenda' })); this.fire('Visita finalizada · check-out registrado'); };\n  openOco = (id) => this.setState(s => ({ selOco: id, stack: [...s.stack, 'ocorrencia'] }));\n  assumeOco = () => this.setState(s => ({ ocoStatus: { ...s.ocoStatus, [s.selOco]: 'tratamento' } }));\n  setSolution = (e) => { const v = e.target.value; this.setState({ ocoSolution: v }); };\n  resolveOco = () => { this.setState(s => ({ ocoStatus: { ...s.ocoStatus, [s.selOco]: 'resolvida' }, stack: s.stack.slice(0, -1) })); this.fire('Ocorrência encerrada · histórico registrado'); };\n  setDisp = (v) => this.setState(s => ({ survey: { ...s.survey, disp: v } }));\n  setRuptura = (v) => this.setState(s => ({ survey: { ...s.survey, ruptura: v } }));\n  stepFaces = (d) => this.setState(s => ({ survey: { ...s.survey, faces: Math.max(0, s.survey.faces + d) } }));\n  setPreco = (e) => { const v = e.target.value; this.setState(s => ({ survey: { ...s.survey, preco: v } })); };\n  toggleSku = (n) => this.setState(s =
